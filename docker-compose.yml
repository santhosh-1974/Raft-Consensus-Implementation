services:

  node1:
    build:
      context: .
      target: production
    container_name: raft-node-1
    environment:
      NODE_ID: node1
      PORT: 5001
      PEERS: node2:5002,node3:5003
    ports:
      - "5001:5001"
    volumes:
      - node1-data:/app/data

  node2:
    build:
      context: .
      target: production
    container_name: raft-node-2
    environment:
      NODE_ID: node2
      PORT: 5002
      PEERS: node1:5001,node3:5003
    ports:
      - "5002:5002"
    volumes:
      - node2-data:/app/data

  node3:
    build:
      context: .
      target: production
    container_name: raft-node-3
    environment:
      NODE_ID: node3
      PORT: 5003
      PEERS: node1:5001,node2:5002
    ports:
      - "5003:5003"
    volumes:
      - node3-data:/app/data

volumes:
  node1-data:
  node2-data:
  node3-data: